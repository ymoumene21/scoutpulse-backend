# docker-compose.yml
# Declares the services (containers) this project needs to run.
# Right now we only need one: a Postgres database.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoutpulse
      POSTGRES_PASSWORD: scoutpulse_dev
      POSTGRES_DB: scoutpulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: